<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AR Floor Defense</title>
  <style>
    :root {
      --cyan: #5ad0ff;
      --blue: #2b6cff;
      --gold: #ffd23f;
      --danger: #ff5160;
      --good: #43e07f;
      --glass: rgba(10, 18, 40, 0.55);
      --glass-line: rgba(120, 200, 255, 0.28);
      --ink: #eaf4ff;
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04060f; color: var(--ink); }
    button { font-family: inherit; }

    /* ===================================================================
       START SCREEN (normal DOM, shown before the AR session begins)
       =================================================================== */
    #start {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; text-align: center; padding: 32px;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(43,108,255,0.35), transparent 60%),
        radial-gradient(100% 90% at 50% 100%, rgba(90,208,255,0.18), transparent 55%),
        linear-gradient(180deg, #060b1c 0%, #04060f 100%);
    }
    #start .badge {
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--cyan); opacity: 0.9; border: 1px solid var(--glass-line);
      padding: 6px 14px; border-radius: 999px; background: var(--glass);
    }
    #start h1 {
      font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff, var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 40px rgba(90,208,255,0.35);
    }
    #start p.tag { font-size: 15px; opacity: 0.8; max-width: 320px; line-height: 1.5; }

    .enter-btn {
      position: relative; margin-top: 8px; padding: 18px 46px;
      font-size: 19px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: #021018; border: none; border-radius: 16px; cursor: pointer;
      background: linear-gradient(180deg, var(--cyan), var(--blue));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 14px 40px rgba(43,108,255,0.5);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .enter-btn:active { transform: scale(0.97); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 14px 40px rgba(43,108,255,0.45); }
      50%      { box-shadow: 0 0 0 1px rgba(255,255,255,0.3), 0 14px 60px rgba(90,208,255,0.75); }
    }

    .reqs { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; opacity: 0.7; margin-top: 6px; }
    .reqs b { color: var(--cyan); }
    #start .error { color: var(--danger); font-size: 14px; max-width: 320px; display: none; }

    /* ===================================================================
       AR OVERLAY (this element is the WebXR dom-overlay root)
       =================================================================== */
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* ---- Top HUD bar ---- */
    #hud-top {
      position: absolute; top: max(14px, env(safe-area-inset-top)); left: 12px; right: 12px;
      display: none; align-items: center; justify-content: space-between; gap: 10px;
    }
    .pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 14px; padding: 8px 12px; backdrop-filter: blur(10px);
    }
    .wave-badge { font-weight: 800; letter-spacing: 1.5px; font-size: 14px; text-transform: uppercase; }
    .wave-badge small { display: block; font-size: 9px; letter-spacing: 2px; opacity: 0.6; font-weight: 600; }

    .health { flex: 1; max-width: 200px; }
    .health .bar { position: relative; flex: 1; height: 12px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .health .fill { position: absolute; inset: 0; width: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--good), #b6ffce); transition: width 0.25s ease, background 0.25s ease; }
    .health .icon { font-size: 16px; }

    .coins { font-weight: 800; font-size: 15px; color: var(--gold); }
    .coins .icon { font-size: 16px; }

    /* ---- Center crosshair ---- */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
      transform: translate(-50%, -50%); display: none;
      border: 2px solid rgba(120,200,255,0.85); border-radius: 50%;
      transition: border-color 0.12s, transform 0.12s; box-shadow: 0 0 12px rgba(90,208,255,0.4);
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(120,200,255,0.85); border-radius: 2px;
    }
    #crosshair::before { top: 50%; left: 50%; width: 5px; height: 5px; transform: translate(-50%,-50%); }
    #crosshair.lock { border-color: var(--danger); transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 0 16px rgba(255,81,96,0.7); }
    #crosshair.lock::before { background: var(--danger); }

    /* ---- Fire button ---- */
    #fire {
      position: absolute; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); display: none; pointer-events: auto;
      width: 84px; height: 84px; border-radius: 50%; cursor: pointer;
      border: 2px solid rgba(255,255,255,0.35);
      background: radial-gradient(circle at 50% 35%, rgba(255,120,120,0.95), #c61a2c);
      box-shadow: 0 0 0 6px rgba(255,81,96,0.18), 0 10px 30px rgba(0,0,0,0.5);
      color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    }
    #fire:active { transform: translateX(-50%) scale(0.9); box-shadow: 0 0 0 3px rgba(255,81,96,0.25); }

    /* ---- Scan / placement hint ---- */
    #hint {
      position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
      width: 86%; max-width: 360px;
    }
    #hint .scan-ring {
      width: 64px; height: 64px; border-radius: 50%;
      border: 3px solid var(--cyan); border-top-color: transparent;
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint .scan-tap { font-size: 40px; animation: tapb 1.1s ease-in-out infinite; }
    @keyframes tapb { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }
    #hint .text {
      background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px);
      padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: 600; line-height: 1.4;
    }

    /* ---- Wave banner (big, animates in then fades) ---- */
    #wave-banner {
      position: absolute; top: 34%; left: 50%; transform: translate(-50%, 0);
      text-align: center; opacity: 0; pointer-events: none;
    }
    #wave-banner .n {
      font-size: 56px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      background: linear-gradient(180deg, #fff, var(--cyan)); -webkit-background-clip: text;
      background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(90,208,255,0.5);
    }
    #wave-banner .sub { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--danger); font-weight: 700; }
    #wave-banner.show { animation: banner 1.9s ease-out forwards; }
    @keyframes banner {
      0%   { opacity: 0; transform: translate(-50%, 18px) scale(0.9); }
      18%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      78%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -14px) scale(1.02); }
    }

    /* ---- Damage vignette (red edge flash when hit) ---- */
    #vignette {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      box-shadow: inset 0 0 120px 30px rgba(255,40,60,0.85);
    }
    #vignette.hit { animation: vig 0.5s ease-out; }
    @keyframes vig { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

    /* ---- Game over ---- */
    #gameover {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 32px;
      background: radial-gradient(80% 60% at 50% 50%, rgba(120,10,20,0.55), rgba(2,4,10,0.88));
      backdrop-filter: blur(3px);
    }
    #gameover h1 { font-size: 44px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--danger); text-shadow: 0 0 30px rgba(255,40,60,0.6); }
    #gameover .stats-row { display: flex; gap: 26px; margin: 8px 0 4px; }
    #gameover .stat { display: flex; flex-direction: column; }
    #gameover .stat .v { font-size: 30px; font-weight: 800; }
    #gameover .stat .l { font-size: 11px; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; }
    #restart {
      pointer-events: auto; margin-top: 10px; padding: 16px 40px; font-size: 17px; font-weight: 800;
      letter-spacing: 2px; text-transform: uppercase; color: #021018; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(180deg, var(--cyan), var(--blue)); box-shadow: 0 10px 34px rgba(43,108,255,0.5);
    }
    #restart:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <!-- Start screen (before AR) -->
  <div id="start">
    <span class="badge">WebXR · AR</span>
    <h1>AR Floor<br>Defense</h1>
    <p class="tag">Open a portal on your floor and survive the endless waves.</p>
    <button id="enter" class="enter-btn">Enter AR</button>
    <div class="reqs">
      <span>📱 <b>Android</b> · Chrome · ARCore</span>
      <span>Pan slowly to find the floor, then tap to place your portal.</span>
    </div>
    <p id="start-error" class="error"></p>
  </div>

  <!-- AR overlay (during AR) -->
  <div id="overlay">
    <div id="hud-top">
      <div class="pill wave-badge"><span><small>Wave</small><span id="stat-wave">1</span></span></div>
      <div class="pill health">
        <span class="icon">❤️</span>
        <div class="bar"><div class="fill" id="hp-fill"></div></div>
      </div>
      <div class="pill coins"><span class="icon">🪙</span><span id="stat-coins">0</span></div>
    </div>

    <div id="hint">
      <div class="scan-ring" id="scan-ring"></div>
      <div class="text" id="hint-text">Move your phone slowly to scan the floor…</div>
    </div>

    <div id="wave-banner"><div class="n" id="banner-n">Wave 1</div><div class="sub">Enemies incoming</div></div>

    <div id="crosshair"></div>
    <button id="fire">Fire</button>
    <div id="vignette"></div>

    <div id="gameover">
      <h1>Game Over</h1>
      <div class="stats-row">
        <div class="stat"><span class="v" id="go-wave">1</span><span class="l">Wave</span></div>
        <div class="stat"><span class="v" id="go-coins">0</span><span class="l">Coins</span></div>
      </div>
      <button id="restart">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
